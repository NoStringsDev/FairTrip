name = "fair-trip-api"
main = "worker/src/index.ts"
compatibility_date = "2025-05-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# Required for React Router deep links / browser refresh — navigation requests bypass the Worker script
# unless this is set (Workers serve static assets first for navigations since compatibility_date 2025-04-01).
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "fair-trip-db"
database_id = "b302b6db-9fcc-4bf7-a6e6-f6a31b05c036"

[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "fairtrip-reciepts"
